# For a NEW Render Blueprint. For an existing Render Web Service,
# change Settings > Build > Source in the Render Dashboard instead.
services:
  - type: web
    name: footframe-acrolab
    runtime: python
    plan: free
    repo: https://github.com/ACROLab/footframe
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
